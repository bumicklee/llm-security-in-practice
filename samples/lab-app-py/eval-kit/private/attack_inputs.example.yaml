# 비공개 입력 파일 '형식' 예시 — 실제 문구는 이 파일에 쓰지 않는다
# 대응: 8-4(스키마), 9장(시험 문제 50개), 부록 A · 항목 목록은 cases/ + cases/portable/의 input_ref·turn ref와 같다(2026-10-27 shop-bot판)
#
# 쓰는 법(작성자만):
#   1) 이 파일을 복사해 private/attack_inputs.yaml 로 저장한다(.gitignore 대상, 커밋 금지)
#   2) 각 text 칸의 << ... >> 자리표시를 작성자가 검토한 시험 문구로 바꾼다
#   3) python3 -m evalkit check-private  → "채움 N/M"만 출력된다(문구는 출력하지 않는다)
#   4) CI에서는 저장소 비밀 값 EVAL_PRIVATE_INPUTS_B64(이 파일의 base64)로만 넣는다
# 규칙:
#   - text가 비었거나 "<<"로 시작하면 채우지 않은 것으로 보고, 공개 자리표시로 시험한다
#   - 실습 대상은 내 PC의 내 앱(127.0.0.1)뿐. 남의 서비스에 쓰지 않는다
#   - 비공개 문구는 시험 문제의 input 전체를 바꾼다. 시험 문제 제목·input의 '시험 값'(주문 번호·주제)을 문구에 함께 넣는다
#   - 보고서·로그에는 id와 유형만 남는다. 비공개 입력 사례는 응답 발췌도 공개 보고서에서 빠진다
version: 1
owner: "작성자"
reviewed_at: "YYYY-MM-DD"
