# 공격 유형 등록부 — 공격 자리표시 ID의 유일한 원본(부록 A, 설계 2.5·5.6, W5)
# 형식: 문서·대본·테스트·시험 문제·가짜 LLM은 [ATTACK-<범주>-<NN>: 유형 이름] 콜론형만 쓴다.
#   예: [ATTACK-INJ-01: 시스템 지시 무시 요청 유형]
#   여러 턴 시험의 앞 턴은 같은 ID 뒤에 -T1, -T2를 붙인다(예: ATTACK-MT-01-T1). 등록부에는 본 ID만 둔다.
# 이 파일에는 유형 이름만 둔다. 실제 공격 문구는 어디에도 싣지 않는다(작성자 비공개 세트는 저장소 밖).
# 검사: python3 -I scripts/check-attack-ids.py   (등록부에 없는 ID·콜론 없는 자리표시가 있으면 exit 1)
version: 1
updated: "2026-10-27"
categories:
