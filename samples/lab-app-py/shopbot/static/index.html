<!doctype html>
<!-- 목적: 랩 채팅 화면(2장). 사용자 선택 → 질문 → 답, 승인 대기 목록, 내 토큰.
     출력 처리(11장): lab.defense.output-escape=true 이면 textContent, false 이면 innerHTML(수정 전 재현). -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>쇼핑몰 상담봇 랩 (127.0.0.1)</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 24px auto; }
    #log div { margin: 6px 0; padding: 8px; border-radius: 8px; }
    .me { background: #eef; text-align: right; } .bot { background: #efe; } .err { background: #fee; }
    .badge { background: #ffd54f; padding: 2px 6px; border-radius: 4px; } .cite { color: #555; font-size: 90%; }
    #mode { font-weight: bold; } button { margin-left: 4px; }
  </style>
</head>
<body>
  <h1>쇼핑몰 상담봇 <small id="mode"></small></h1>
  <p>사용자:
    <select id="user"><option>alice</option><option>bob</option><option>dave</option><option>carol</option></select>
    오늘 토큰: <span id="tokens">0</span>
  </p>
  <div id="log"></div>
  <form id="f"><input id="msg" size="60" placeholder="무엇을 도와드릴까요?"><button>보내기</button></form>
  <h3>상품 질문(RAG, 5~6장)</h3>
  <form id="qa"><input id="q" size="50" placeholder="환불 규정 알려 주세요"><button>질문</button></form>
  <div id="qaOut"></div>
  <h3>리뷰 등록(5장)</h3>
  <form id="rv"><input id="rt" size="50" placeholder="리뷰 내용"><button>등록</button></form>
  <div id="rvOut"></div>
  <h3>승인 대기</h3>
  <ul id="approvals"></ul>
  <script src="app.js"></script>
</body>
</html>
