# 로컬 LM Studio로 바꿔 끼우기(2장 2.4). 실행: LAB_PROFILES=lmstudio
# LM Studio의 OpenAI 호환 서버를 127.0.0.1:1234 에서 켠다. 모델 이름은 LM Studio 화면의 모델 ID로(LLM_MODEL, 예: openai/gpt-oss-20b — 2026-10-29 실측)
llm_base_url: "http://127.0.0.1:1234/v1"
openai_api_key: "sk-test-FAKE-lmstudio"   # 인증을 켜지 않았을 때의 가짜 값. 켰다면 토큰을 OPENAI_API_KEY 환경 변수로만 준다(2장 2.4)
llm_model: "local-model"
structured_output: "tool"                  # 출력 스키마를 도구 호출로 받는다(로컬 서버는 도구 + response_format을 함께 못 다룸, 4장 4.4)
